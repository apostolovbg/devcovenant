name: Publish

on:
  workflow_dispatch:

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean local build artifacts
        run: |
          rm -rf build dist ./*.egg-info .pytest_cache .ruff_cache

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine cyclonedx-bom==7.2.2

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/sbom
          cyclonedx-py requirements requirements.lock \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --output-file artifacts/sbom/devcovenant-sbom.json

      - name: Smoke install wheel
        run: |
          set -euo pipefail
          WHEEL_PATH="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL_PATH"
          python -m venv .smoke-wheel
          . .smoke-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL_PATH"
          python -m devcovenant --help > /dev/null

      - name: Smoke install sdist
        run: |
          set -euo pipefail
          SDIST_PATH="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$SDIST_PATH"
          python -m venv .smoke-sdist
          . .smoke-sdist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$SDIST_PATH"
          python -m devcovenant --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: devcovenant-dist
          path: dist/*

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: devcovenant-sbom
          path: artifacts/sbom/*.json

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-distributions
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/devcovenant
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: devcovenant-dist
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
