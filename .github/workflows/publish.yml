name: Publish

on:
  workflow_dispatch:

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean local build artifacts
        run: |
          rm -rf build dist ./*.egg-info .pytest_cache .ruff_cache

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Smoke install wheel
        run: |
          set -euo pipefail
          WHEEL_PATH="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL_PATH"
          python -m venv .smoke-wheel
          . .smoke-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL_PATH"
          python -m devcovenant --help > /dev/null

      - name: Smoke install sdist
        run: |
          set -euo pipefail
          SDIST_PATH="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$SDIST_PATH"
          python -m venv .smoke-sdist
          . .smoke-sdist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$SDIST_PATH"
          python -m devcovenant --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: devcovenant-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-distributions
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: devcovenant-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publish tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
