name: CI
on:
  push:
  pull_request:
jobs:
  ci-and-test:
    name: DevCovenant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install tooling and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.lock
    - name: Run DevCovenant start gate
      run: python -m devcovenant gate --start
    - name: Run DevCovenant mid gate
      run: python -m devcovenant gate --mid
    - name: Run DevCovenant workflow runs
      run: python -m devcovenant run
    - name: Run DevCovenant end gate
      run: python -m devcovenant gate --end
    - name: Install scanner dependencies
      run: python -m pip install bandit==1.9.4 pip-audit==2.10.0
    - name: Audit locked dependencies
      run: pip-audit -r requirements.lock --ignore-vuln CVE-2026-4539
    - name: Run Bandit
      run: bandit -q -c bandit.yaml -r devcovenant
  build-and-install-test:
    name: Build and Install
    needs: ci-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python bootstrap
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine pipx
    - name: Build package artifacts
      run: python -m build --outdir dist
    - name: Validate built artifacts
      run: python -m twine check dist/*
    - name: Prove wheel artifact lifecycle
      run: |
        set -euo pipefail
        ARTIFACT_PATH="$(
          find dist -maxdepth 1 -name '*.whl' -print -quit
        )"
        test -n "$ARTIFACT_PATH"
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "$TMPDIR"' EXIT
        python -m venv "$TMPDIR/venv"
        "$TMPDIR/venv/bin/python" -m pip install --upgrade pip
        "$TMPDIR/venv/bin/python" -m pip install "$ARTIFACT_PATH"
        git init -q "$TMPDIR/repo"
        pushd "$TMPDIR/repo" >/dev/null
        git config user.name ci
        git config user.email ci@example.invalid
        "$TMPDIR/venv/bin/python" -m devcovenant install
        "$TMPDIR/venv/bin/python" - <<'PY'
        from pathlib import Path

        path = Path("devcovenant/config.yaml")
        text = path.read_text(encoding="utf-8")
        old = "config_reviewed: false"
        if old not in text:
            raise SystemExit(
                "config_reviewed flag not found in config.yaml"
            )
        path.write_text(
            text.replace(old, "config_reviewed: true", 1),
            encoding="utf-8",
        )
        PY
        "$TMPDIR/venv/bin/python" -m devcovenant deploy
        "$TMPDIR/venv/bin/python" -m devcovenant check
        popd >/dev/null
    - name: Prove sdist artifact lifecycle
      run: |
        set -euo pipefail
        ARTIFACT_PATH="$(
          find dist -maxdepth 1 -name '*.tar.gz' -print -quit
        )"
        test -n "$ARTIFACT_PATH"
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "$TMPDIR"' EXIT
        python -m venv "$TMPDIR/venv"
        "$TMPDIR/venv/bin/python" -m pip install --upgrade pip
        "$TMPDIR/venv/bin/python" -m pip install "$ARTIFACT_PATH"
        git init -q "$TMPDIR/repo"
        pushd "$TMPDIR/repo" >/dev/null
        git config user.name ci
        git config user.email ci@example.invalid
        "$TMPDIR/venv/bin/python" -m devcovenant install
        "$TMPDIR/venv/bin/python" - <<'PY'
        from pathlib import Path

        path = Path("devcovenant/config.yaml")
        text = path.read_text(encoding="utf-8")
        old = "config_reviewed: false"
        if old not in text:
            raise SystemExit(
                "config_reviewed flag not found in config.yaml"
            )
        path.write_text(
            text.replace(old, "config_reviewed: true", 1),
            encoding="utf-8",
        )
        PY
        "$TMPDIR/venv/bin/python" -m devcovenant deploy
        "$TMPDIR/venv/bin/python" -m devcovenant check
        popd >/dev/null
    - name: Install DevCovenant with pipx
      run: python -m pipx install --force dist/*.whl
    - name: Resolve pipx bin directory
      run: |
        PIPX_BIN_DIR="$(python -m pipx environment --value PIPX_BIN_DIR)"
        echo "PIPX_BIN_DIR=$PIPX_BIN_DIR" >> "$GITHUB_ENV"
    - name: Prove pipx operator lifecycle
      run: |
        set -euo pipefail
        TMPDIR="$(mktemp -d)"
        trap 'rm -rf "$TMPDIR"' EXIT
        git init -q "$TMPDIR/repo"
        pushd "$TMPDIR/repo" >/dev/null
        git config user.name ci
        git config user.email ci@example.invalid
        "$PIPX_BIN_DIR/devcovenant" --version
        "$PIPX_BIN_DIR/devcovenant" install
        python - <<'PY'
        from pathlib import Path

        path = Path("devcovenant/config.yaml")
        text = path.read_text(encoding="utf-8")
        old = "config_reviewed: false"
        if old not in text:
            raise SystemExit(
                "config_reviewed flag not found in config.yaml"
            )
        path.write_text(
            text.replace(old, "config_reviewed: true", 1),
            encoding="utf-8",
        )
        PY
        "$PIPX_BIN_DIR/devcovenant" deploy
        mkdir -p tests
        cat > tests/__init__.py <<'PY'
        """Proof-test package for installed workflow validation."""
        PY
        cat > tests/test_smoke.py <<'PY'
        """Installed artifact smoke tests for lifecycle proof."""

        import unittest


        class SmokeTest(unittest.TestCase):
            """Prove the packaged workflow can run a minimal test suite."""

            def test_truth(self) -> None:
                """Keep the installed-artifact proof suite non-empty."""
                self.assertTrue(True)


        if __name__ == "__main__":
            unittest.main()
        PY
        "$PIPX_BIN_DIR/devcovenant" refresh
        git add .
        git commit -m "bootstrap pipx repo"
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.lock
        "$PIPX_BIN_DIR/devcovenant" gate --start
        "$PIPX_BIN_DIR/devcovenant" gate --mid
        "$PIPX_BIN_DIR/devcovenant" run
        "$PIPX_BIN_DIR/devcovenant" gate --end
        "$PIPX_BIN_DIR/devcovenant" check
        popd >/dev/null
