name: CI
on:
  push:
  pull_request:
jobs:
  ci-and-test:
    name: DevCovenant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install tooling and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.lock
    - name: Run DevCovenant start gate
      run: python -m devcovenant gate --start
    - name: Run DevCovenant mid gate
      run: python -m devcovenant gate --mid
    - name: Run DevCovenant workflow runs
      run: python -m devcovenant run
    - name: Run DevCovenant end gate
      run: python -m devcovenant gate --end
    - name: Install scanner dependencies
      run: python -m pip install bandit==1.9.4 pip-audit==2.10.0
    - name: Audit locked dependencies
      run: pip-audit -r requirements.lock --ignore-vuln CVE-2026-4539
    - name: Run Bandit
      run: bandit -q -c bandit.yaml -r devcovenant
