name: CI and Test
on:
  push:
  pull_request:
jobs:
  ci-and-test:
    name: CI and Test (Bootstrap Python 3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install tooling and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.lock
    - name: Run DevCovenant start gate
      run: python -m devcovenant gate --start
    - name: Run DevCovenant tests
      run: python -m devcovenant test
    - name: Run DevCovenant end gate
      run: python -m devcovenant gate --end
    - name: Install scanner dependencies
      run: python -m pip install bandit==1.9.4 pip-audit==2.10.0
    - name: Audit locked dependencies
      run: pip-audit -r requirements.lock
    - name: Run Bandit
      run: bandit -q -c bandit.yaml -r devcovenant
  build-and-install-test:
    name: Build and Install Test
    needs: ci-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python bootstrap
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine pipx
    - name: Build package artifacts
      run: python -m build --outdir dist
    - name: Validate built artifacts
      run: python -m twine check dist/*
    - name: Install DevCovenant with pipx
      run: python -m pipx install dist/*.whl
    - name: Verify installed CLI
      run: |
        ~/.local/bin/devcovenant --version
        ~/.local/bin/devcovenant check --help > /dev/null
        ~/.local/bin/devcovenant gate --status > /dev/null
