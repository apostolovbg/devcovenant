name: Governance and Test
on:
  push:
  pull_request:
jobs:
  governance-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/devcovenant-pycache
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install tooling and dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -r requirements.lock

        '
    - name: Run DevCovenant start gate
      run: python3 -m devcovenant gate --start
    - name: Run DevCovenant tests
      run: python3 -m devcovenant test
    - name: Run DevCovenant end gate
      run: python3 -m devcovenant gate --end
