        => devcovenant/docs/config.md, devcovenant/*/profiles/*/assets/*.yaml=> devcovenant/docs/profiles.md,
        devcovenant/*/profiles/*/assets/*.yml=> devcovenant/docs/profiles.md, devcovenant/*/profiles/**/assets/**/*.yaml=>
        devcovenant/docs/profiles.md, devcovenant/*/profiles/**/assets/**/*.yml=>
        devcovenant/docs/profiles.md, devcovenant/custom/profiles/__init__.py => devcovenant/docs/profiles.md,
