      id: managed-environment
      severity: error
      auto_fix: 'false'
      enforcement: active
      enabled: 'true'
      custom: 'false'
      expected_paths: .venv
      expected_interpreters: .venv/bin/python, .venv/Scripts/python.exe
      cleanup_protected_paths: ''
      required_commands: python3, pre-commit, pytest
      manual_commands: python3 -m venv .venv, {managed_python} -m pip install -r requirements.lock
