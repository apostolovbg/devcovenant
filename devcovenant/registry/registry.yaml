      template: docs/troubleshooting.md
    ci_and_test:
      jobs:
        compatibility-matrix:
          name: Supported Python Compatibility (Python ${{ matrix.python-version }})
          runs-on: ubuntu-latest
          permissions:
            contents: read
          strategy:
            fail-fast: false
            matrix:
              python-version:
              - '3.10'
              - '3.11'
              - '3.12'
              - '3.13'
          env:
            PYTHONPYCACHEPREFIX: .gha-pycache
          steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Set up Python bootstrap
            uses: actions/setup-python@v5
            with:
              python-version: ${{ matrix.python-version }}
          - name: Install DevCovenant bootstrap dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.lock
          - name: Prime managed environment
            run: python -m devcovenant gate --status > /dev/null
          - name: Verify CLI entrypoints
            run: |
              python -m devcovenant --version
              python -m devcovenant check --help > /dev/null
          - name: Run compatibility contract tests
            run: |
              python -m pytest -q \
                tests/devcovenant/test_cli.py \
                tests/devcovenant/core/services/test_core_invariants.py \
                tests/devcovenant/core/services/test_policy_runtime_actions.py
        assurance:
          name: Assurance Scanners
          runs-on: ubuntu-latest
          permissions:
            contents: read
          env:
            PYTHONPYCACHEPREFIX: .gha-pycache
          steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Set up Python bootstrap
            uses: actions/setup-python@v5
            with:
              python-version: '3.14'
          - name: Install DevCovenant bootstrap dependencies
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.lock
          - name: Prime managed environment
            run: python -m devcovenant gate --status > /dev/null
          - name: Install scanner dependencies
            run: python -m pip install bandit==1.9.4 pip-audit==2.10.0
          - name: Audit locked dependencies
            run: pip-audit -r requirements.lock
          - name: Run Bandit
            run: bandit -q -c bandit.yaml -r devcovenant
    policy_overlays:
      dependency-management:
        dependency_role_files:
        - intent=>requirements.in
        - resolved=>requirements.lock
        - package_manifest=>pyproject.toml
      managed-environment:
        expected_paths:
