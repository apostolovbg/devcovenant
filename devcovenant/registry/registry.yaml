workflow_contract:
  schema_version: 4
  anchors:
  - id: start
    owner: core
    anchor_kind: gate_anchor
  - id: mid
    owner: core
    anchor_kind: gate_anchor
  - id: end
    owner: core
    anchor_kind: gate_anchor
  runs:
  - id: tests
    owner: profile
    owner_id: python
    enabled: true
    position:
      after: mid
      before: end
      order: 100
    runner:
      kind: command_group
      commands:
      - python3 -m unittest discover -v
    success_contract:
      kind: all_commands_exit_zero
    recording:
      record_in_session: true
      summary_label: Tests
      output_mode_config_field: engine.tests_output_mode
      event_adapter_group: run_events
      write_runtime_profile: true
    freshness:
      kind: ignore_paths
      ignored_files:
      - CHANGELOG.md
      ignored_globs: []
    source_field: workflow_runs
  run_ids:
  - tests
  active_profiles:
  - global
  - defaults
  - devcovrepo
  - docs
  - python
policies:
  changelog-coverage:
    enabled: true
    custom: false
    description: Changelog Coverage
    policy_text: |-
      Every change must be logged in a new changelog entry dated today, under the
      current version, with a three-line summary labeled Change/Why/Impact. Each
      summary line must include an action verb listed in the summary_verbs
      metadata and a Files block that lists only the touched paths for this
      change. The policy compares the top changelog entry against the gate-start
      top-entry fingerprint to require a fresh entry for each work session, while
      resolving changed paths from the active gate session. Collection prefixes
      (when enabled) must be logged in their own changelog; prefixed files may not
      appear in the root changelog. This keeps release notes daily, file-complete,
      and traceable.
    metadata:
      id: changelog-coverage
      severity: error
      auto_fix: 'false'
      enforcement: active
      enabled: 'true'
      custom: 'false'
      main_changelog: CHANGELOG.md
      skipped_files: devcovenant/config.yaml, CHANGELOG.md, .gitignore, .pre-commit-config.yaml,
        .github/workflows/ci.yml
      skipped_globs: .vscode/**, .idea/**, .venv/**, .python/**, build/**, dist/**,
        __pycache__/**, *.egg-info/**, pip-wheel-metadata/**, .pytest_cache/**, .ruff_cache/**,
        .mypy_cache/**, .tox/**, .nox/**, .hypothesis/**, .coverage, .coverage.*,
        htmlcov/**, devcovenant/logs/**, devcovenant/registry/runtime/**
      skipped_prefixes: ''
      summary_labels: Change, Why, Impact
      summary_verbs: add, added, address, addressed, adjust, adjusted, align, aligned,
        amend, amended, automate, automated, bootstrap, build, built, bump, bumped,
        cache, clean, cleaned, clarify, clarified, consolidate, consolidated, configure,
        correct, corrected, create, created, define, defined, deserialize, deprecate,
        deprecated, detect, document, documented, drop, dropped, enable, enabled,
        enforce, enforced, expand, expanded, extract, fix, fixed, harden, hardened,
        implement, improve, improved, instrument, integrate, introduce, introduced,
        invalidate, lock, materialize, merge, migrate, migrated, normalize, normalized,
        optimize, pin, preserve, prevent, profile, publish, reconcile, regenerate,
        refactor, refactored, release, remove, removed, rename, renamed, replace,
        replaced, resolve, restructure, restructured, revert, revise, revised, sanitize,
        scaffold, serialize, simplify, simplified, split, stabilize, stabilized, streamline,
        streamlined, support, supported, sync, tune, unpin, update, updated, upgrade,
        upgraded, validate, validated, verify, verified, wrap, wrapped, allow, allowed,
        analyze, analyzed, annotate, annotated, assess, assessed, audit, audited,
        calculate, calculated, check, checked, choose, chosen, close, closed, collect,
        collected, compare, compared, complete, completed, compose, composed, constrain,
        constrained, convert, converted, copy, copied, cover, covered, delete, deleted,
        derive, derived, describe, described, design, designed, diagnose, diagnosed,
        disable, disabled, ensure, ensured, estimate, estimated, evaluate, evaluated,
        execute, executed, explain, explained, expose, exposed, finalize, finalized,
        make, made, map, mapped, mark, marked, measure, measured, organize, organized,
        prioritize, prioritized, promote, promoted, prune, pruned, prove, proved,
        record, recorded, reduce, reduced, reject, rejected, repair, repaired, report,
        reported, reset, restore, restored, retain, retained, review, reviewed, rewrite,
        rewrote, select, selected, sequence, sequenced, show, showed, sort, sorted,
        stage, staged, standardize, standardized, strengthen, strengthened, suppress,
        suppressed, test, tested
      gate_status_file: devcovenant/registry/runtime/gate_status.json
      collections: ''
      header_doc_suffixes: .md, .rst, .txt
      header_keys: Last Updated, Project Version, Project Stage, Maintenance Stance,
        Compatibility Policy, Versioning Mode, Project Codename, Build Identity, DevCovenant
        Version
      header_scan_lines: '4'
      required_globs: README.md, AGENTS.md, CONTRIBUTING.md, CHANGELOG.md, SPEC.md,
        PLAN.md
      selector_roles: skipped,header_doc,required
      skipped_dirs: ''
      header_doc_globs: '*.md, *.rst, *.txt'
      header_doc_files: ''
      header_doc_dirs: ''
      required_files: ''
      required_dirs: ''
    metadata_resolution:
      id:
        descriptor:
          values:
          - changelog-coverage
          behavior: base
        runtime_identity:
          values:
          - changelog-coverage
          behavior: replace
        effective:
          values:
          - changelog-coverage
      severity:
        descriptor:
          values:
          - error
          behavior: base
        effective:
          values:
          - error
      auto_fix:
        descriptor:
          values:
          - 'false'
          behavior: base
        effective:
          values:
          - 'false'
      enforcement:
        descriptor:
          values:
          - active
          behavior: base
        effective:
          values:
          - active
      main_changelog:
        descriptor:
          values: []
          behavior: base
        profile_overlays:
          values:
          - CHANGELOG.md
          behavior: append
        autogen_overlays:
          values:
          - CHANGELOG.md
          behavior: append
        effective:
          values:
          - CHANGELOG.md
      skipped_files:
        descriptor:
          values: []
          behavior: base
        profile_overlays:
          values:
          - devcovenant/config.yaml
          - CHANGELOG.md
          - .gitignore
          - .pre-commit-config.yaml
          - .github/workflows/ci.yml
