          values:
          - 'false'
          behavior: base
        effective:
          values:
          - 'false'
      enforcement:
        descriptor:
          values:
          - active
          behavior: base
        effective:
          values:
          - active
      main_changelog:
        descriptor:
          values: []
          behavior: base
        profile_overlays:
