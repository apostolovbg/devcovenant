        docs=>devcovenant/builtin/policies/README.md, docs=>devcovenant/builtin/profiles/README.md,
        docs=>devcovenant/custom/policies/README.md, docs=>devcovenant/custom/profiles/README.md,
        package_manifest=>pyproject.toml
      target_role_globs: docs=>devcovenant/docs/**/*.md
      target_role_dirs: docs=>devcovenant/docs
      changelog_file: CHANGELOG.md
      changelog_header_prefix: '## Version'
      selector_roles: target
      target_globs: ''
      target_files: ''
