  documentation-growth-tracking:
    enabled: true
    custom: false
    description: Documentation Growth Tracking
    policy_text: |-
      When user-facing files change (as defined by the user-facing selectors and
      keywords), the documentation set listed here must be updated. User-facing
      includes API surfaces, integration touchpoints, and any behavior that affects
      the user's experience or workflow. Updated docs should mention the relevant
      components by name so readers can find changes quickly. The policy also
      enforces documentation quality standards such as clear core headings,
      minimum depth, and readable structure. When `doc_routes` is configured,
      each user-facing change must match at least one route and touch all mapped
      docs.
    metadata:
      id: documentation-growth-tracking
      severity: warning
      auto_fix: 'false'
      enforcement: active
      enabled: 'true'
      custom: 'false'
      selector_roles: user_facing, user_visible, doc_quality
      include_prefixes: ''
      exclude_prefixes: ''
      user_facing_prefixes: ''
      user_facing_exclude_prefixes: tests
      user_facing_suffixes: .py, .js, .ts, .tsx, .vue, .go, .rs, .java, .kt, .swift,
        .rb, .php, .cs, .yml, .yaml, .json, .toml
      user_facing_files: .pre-commit-config.yaml, pyproject.toml, devcovenant/cli.py,
        devcovenant/__main__.py
      user_facing_globs: .github/workflows/*.yml, .github/workflows/*.yaml, *.py,
        *.js, *.ts, *.tsx, *.vue, *.go, *.rs, *.java, *.kt, *.swift, *.rb, *.php,
        *.cs, *.yml, *.yaml, *.json, *.toml
      user_facing_keywords: api, endpoint, endpoints, route, routes, routing, service,
        services, controller, controllers, handler, handlers, client, clients, webhook,
        webhooks, integration, integrations, sdk, cli, ui, view, views, page, pages,
        screen, screens, form, forms, workflow, workflows
      user_visible_files: README.md, CONTRIBUTING.md, AGENTS.md, SPEC.md, PLAN.md,
        SECURITY.md, PRIVACY.md, SUPPORT.md, devcovenant/README.md, devcovenant/docs/architecture.md,
        devcovenant/docs/installation.md, devcovenant/docs/config.md, devcovenant/docs/profiles.md,
        devcovenant/docs/policies.md, devcovenant/docs/registry.md, devcovenant/docs/refresh.md,
        devcovenant/docs/workflow.md, devcovenant/docs/troubleshooting.md
      doc_quality_files: README.md, CONTRIBUTING.md, AGENTS.md, SPEC.md, PLAN.md,
        SECURITY.md, PRIVACY.md, SUPPORT.md, devcovenant/README.md, devcovenant/docs/architecture.md,
        devcovenant/docs/installation.md, devcovenant/docs/config.md, devcovenant/docs/profiles.md,
        devcovenant/docs/policies.md, devcovenant/docs/registry.md, devcovenant/docs/refresh.md,
        devcovenant/docs/workflow.md, devcovenant/docs/troubleshooting.md
      required_headings: Overview
      require_toc: 'false'
      min_section_count: '3'
      min_word_count: '120'
      doc_routes: devcovenant/builtin/policies/ => devcovenant/docs/policies.md, devcovenant/builtin/profiles/*/*.yaml
        => devcovenant/docs/profiles.md, devcovenant/*/profiles/*/*translator.py=>
