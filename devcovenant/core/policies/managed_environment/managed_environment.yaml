id: managed-environment
text: |
  DevCovenant must run from the managed environment described in this
  policy's metadata. Use expected_paths for virtualenv or bench roots,
  expected_interpreters for explicit interpreter locations, and
  required_commands with `manual_commands` and stage-scoped
  `managed_commands` to define guidance and runtime preparation. When
  enabled with empty metadata, the policy emits a warning so teams fill
  the required context.
metadata:
  id: managed-environment
  severity: error
  auto_fix: 'false'
  enforcement: active
  enabled: 'false'
  expected_paths: []
  expected_interpreters: []
  required_commands: []
  manual_commands: []
  managed_commands: []
