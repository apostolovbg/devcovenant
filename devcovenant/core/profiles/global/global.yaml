version: 1
profile: global
category: core
suffixes: []
ignore_dirs: []
gitignore_template: gitignore.yaml
governance_template: governance-and-test.yml
pre_commit:
  repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
        - id: check-merge-conflict
        - id: check-yaml
        - id: end-of-file-fixer
        - id: trailing-whitespace
          args: [--markdown-linebreak-ext=md]
    - repo: local
      hooks:
        - id: devcovenant
          name: enforce repository policies (DevCovenant)
          entry: python3 -m devcovenant.cli check
          language: python
          additional_dependencies:
            - PyYAML==6.0.2
            - semver==3.0.2
          types: [text]
          pass_filenames: false
          always_run: true
policy_overlays:
  changelog-coverage:
    skipped_files:
      - devcovenant/config.yaml
  documentation-growth-tracking:
    user_facing_exclude_files:
      - devcovenant/config.yaml
