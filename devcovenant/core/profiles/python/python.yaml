version: 1
profile: python
category: language
suffixes:
  - .py
  - .pyi
  - .pyw
  - .ipynb
ignore_dirs:
  - .venv
  - __pycache__
  - .pytest_cache
  - .mypy_cache
  - build
  - dist
assets:
  - path: requirements.in
    template: requirements.in
  - path: requirements.lock
    template: requirements.lock
  - path: .python-version
    template: .python-version
  - path: pyproject.toml
    template: pyproject.toml
pre_commit:
  repos:
    - repo: https://github.com/psf/black
      rev: 24.4.2
      hooks:
        - id: black
          args: [--line-length, "79"]
    - repo: https://github.com/pycqa/isort
      rev: 5.12.0
      hooks:
        - id: isort
          args: [--profile, black, --line-length, "79"]
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.4.4
      hooks:
        - id: ruff
          args: [--fix, --exit-non-zero-on-fix, --line-length, "79"]
        - id: ruff-format
          args: [--line-length, "79"]
    - repo: https://github.com/pycqa/flake8
      rev: 6.1.0
      hooks:
        - id: flake8
          args: [--max-line-length=79, "--extend-ignore=E203,W503"]
translators:
  - id: python
    extensions:
      - .py
      - .pyi
      - .pyw
    can_handle:
      strategy: module_function
      entrypoint: translator.py:can_handle
    translate:
      strategy: module_function
      entrypoint: translator.py:translate
policy_overlays:
  dependency-license-sync:
    dependency_role_files:
      - intent=>requirements.in
      - resolved=>requirements.lock
      - package_manifest=>pyproject.toml
  devflow-run-gates:
    required_commands_normal:
      - python3 -m unittest discover
      - pytest -q
    required_commands_verbose:
      - python3 -m unittest discover -v
      - pytest
  documentation-growth-tracking:
    user_facing_suffixes:
      - .py
  line-length-limit:
    include_suffixes:
      - .py
  version-sync:
    target_roles:
      - package_manifest
    role_extractors:
      - package_manifest=>manifest_project_version
    target_role_files:
      - package_manifest=>pyproject.toml
  security-scanner:
    include_suffixes:
      - .py
  modules-need-tests:
    include_suffixes:
      - .py
    watch_dirs:
      - tests
    tests_watch_dirs:
      - tests
    mirror_test_name_templates:
      - python=>test_{stem}.py
      - python=>{stem}_test.py
    test_style_requirements:
      - python=>python_unittest
  tests-coverage:
    include_suffixes:
      - .py
    watch_dirs:
      - tests
    tests_watch_dirs:
      - tests
    assertion_signal_patterns:
      - python=>\bassert\b
      - python=>\bself\.assert[A-Za-z_]*\s*\(
    tautology_patterns:
      - python=>^\s*assert\s+True\s*$
      - python=>^\s*self\.assertTrue\s*\(\s*True\s*\)\s*$
    symbol_kinds:
      - function
      - class
    symbol_name_min_length: 3
    symbol_assertion_window: 2
  docstring-and-comment-coverage:
    include_suffixes:
      - .py
  name-clarity:
    include_suffixes:
      - .py
  no-print-outside-output-runtime:
    sink_call_targets:
      - python=>print
      - python=>builtins.print

test_events:
  - id: python
    entrypoint: "devcovenant.core.event_runtime:\
python_test_event_adapter_factory"
