# -------------------------------------------------------------------
# DevCovenant Config Template (generic install baseline)
# -------------------------------------------------------------------
# This file is copied to `devcovenant/config.yaml` by `devcovenant install`.
#
# Install always seeds a safe generic stub:
# - `install.generic_config: true`
# - profile set oriented to user repositories
#
# Typical flow:
# 1) Review/edit this config.
# 2) Set `install.generic_config: false`.
# 3) Run `devcovenant deploy`.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Scope control
# -------------------------------------------------------------------

# Whether policy checks include DevCovenant's own implementation files.
# - false: user-repo mode (ignore core internals)
# - true: DevCovenant-repo mode (enforce the full tree)

devcov_core_include: true

# -------------------------------------------------------------------
# Profile activation
# -------------------------------------------------------------------

# Ordered profile list. `global` should stay first.

# Profiles contribute suffixes, assets, metadata overlays, and cleanup overlays.

# Generated diagnostics include profile-level core path mappings.

# Profiles do not activate policies. Policy activation is `policy_state` for normal toggles.

# `severity: critical` policies remain enforced even when toggled false in `policy_state`.

profiles:
  active:
  - global
  - defaults
  - devcovrepo
  - docs
  - python
  generated:
    file_suffixes:
    - .ipynb
    - .md
    - .py
    - .pyi
    - .pyw
    - .rst
    - .txt
    devcov_core_paths:
    - devcovenant/core
    - devcovenant/builtin
    - devcovenant/__init__.py
    - devcovenant/__main__.py
    - devcovenant/cli.py
    - devcovenant/check.py
    - devcovenant/clean.py
    - devcovenant/gate.py
    - devcovenant/test.py
    - devcovenant/install.py
    - devcovenant/deploy.py
    - devcovenant/upgrade.py
    - devcovenant/refresh.py
    - devcovenant/uninstall.py
    - devcovenant/undeploy.py
    - devcovenant/update_lock.py
    - devcovenant/registry

# -------------------------------------------------------------------
# Canonical paths
# -------------------------------------------------------------------

# Runtime policy source parsed by the engine.

# Generated local policy registry (hashes + diagnostics).

paths:
  policy_definitions: AGENTS.md
  registry_file: devcovenant/registry/registry.yaml

# -------------------------------------------------------------------
# Managed document controls
# -------------------------------------------------------------------

# Documents that refresh may fully materialize from descriptor templates.
# Empty list means runtime backfills defaults.
# Documents in `user` are excluded from full template materialization.
# Managed block refresh still applies when markers are present.

doc_assets:
  autogen:
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  - SPEC.md
  - PLAN.md
  - CHANGELOG.md
  - devcovenant/README.md
  user: []

# -------------------------------------------------------------------
# Install/deploy safety
# -------------------------------------------------------------------

# True after install. Deploy is blocked until user reviews config.

# Set this to false after review to allow `devcovenant deploy`.

install:
  generic_config: false

# -------------------------------------------------------------------
# Engine behavior
# -------------------------------------------------------------------

# Violations at or above fail_threshold fail the run.

# Allowed levels: info, warning, error, critical.

# auto_fix_enabled controls gate-managed policy auto-fix behavior.

# `check` stays read-only.

# logs_keep_last controls run-log retention (`0` keeps all runs).

# pycache_prefix_enabled/pycache_prefix route DevCovenant-managed Python bytecode caches away from the repo tree (empty prefix = auto temp path).

# file_suffixes and ignore_dirs define broad scan boundaries.

engine:
  fail_threshold: warning
  output_mode: normal
  tests_output_mode: normal
  logs_keep_last: 20
  pycache_prefix_enabled: true
  pycache_prefix: ''
  auto_fix_enabled: true
  file_suffixes:
  - .md
  - .rst
  - .txt
  - .yml
  - .yaml
  - .json
  - .toml
  ignore_dirs:
  - .git
  - .venv
  - .python
  - output
  - logs
  - build
  - dist
  - node_modules
  - __pycache__
  - .pytest_cache
  - .cache
  - .venv.lock

# -------------------------------------------------------------------
# Cleanup targets
# -------------------------------------------------------------------

# `clean.overlays` add repository-specific cleanup targets on top of active profile clean_overlays.

# `clean.overrides` replace one resolved cleanup key entirely when repository ownership must take over.

# Protected entries are additive safety fences; runtime also always protects .git, .venv, devcovenant/registry/registry.yaml, devcovenant/registry/README.md, and devcovenant/logs/README.md.

clean:
  overlays:
    build_dirs: []
    build_globs: []
    cache_dirs: []
    cache_globs: []
    runtime_registry_dirs: []
    runtime_registry_globs: []
    logs_dirs: []
    logs_globs: []
    protected_dirs: []
    protected_globs: []
  overrides:
    build_dirs: []
    build_globs: []
    cache_dirs: []
    cache_globs: []
    runtime_registry_dirs: []
    runtime_registry_globs: []
    logs_dirs: []
    logs_globs: []
    protected_dirs: []
    protected_globs: []

# -------------------------------------------------------------------
# Governance-and-test generation
# -------------------------------------------------------------------

# `overlays` are merged into generated governance workflow.

# `overrides` replace generated payload when non-empty.

governance_and_test:
  overlays: {}
  overrides: {}

# -------------------------------------------------------------------
# Pre-commit generation
# -------------------------------------------------------------------

# `overlays` are merged into generated pre-commit config.

# `overrides` replace generated payload when non-empty.

pre_commit:
  overlays: {}
  overrides: {}

# -------------------------------------------------------------------
# Policy activation and customization
# -------------------------------------------------------------------

# Canonical policy activation map: {policy-id: true|false}.

# Critical-severity policies remain enforced even when set to false here.

policy_state:
  changelog-coverage: true
  dependency-license-sync: true
  devcov-integrity-guard: true
  devcov-raw-string-escapes: true
  devcov-structure-guard: true
  devflow-run-gates: true
  docstring-and-comment-coverage: true
  documentation-growth-tracking: true
  last-updated: true
  line-length-limit: true
  managed-doc-assets: true
  managed-environment: true
  modules-need-tests: true
  name-clarity: true
  no-future-dates: true
  no-print-outside-output-runtime: true
  no-raw-errors: true
  project-governance: true
  raw-string-escapes: false
  read-only-directories: true
  readme-sync: true
  security-scanner: true
  tests-coverage: true
  version-governance: false
  version-sync: true

# -------------------------------------------------------------------
# Global ignore patterns
# -------------------------------------------------------------------

# Extra glob patterns excluded from CheckContext file collections.

ignore:
  patterns:
  - devcovenant/config.yaml
  - .vscode/**
  - .idea/**
  - '*.egg-info/**'
  - pip-wheel-metadata/**
  - .pytest_cache/**
  - .ruff_cache/**
  - .mypy_cache/**
  - .tox/**
  - .nox/**
  - .hypothesis/**
  - .coverage
  - .coverage.*
  - htmlcov/**
  - devcovenant/logs/**
  - devcovenant/registry/runtime/**

# -------------------------------------------------------------------
# Gitignore generation
# -------------------------------------------------------------------

# Extra entries appended to generated `.gitignore`.

# Entries are applied before the preserved user block.

# `overrides` replaces generated base/profile/os fragments entirely.

gitignore:
  overlays: []
  overrides: []

