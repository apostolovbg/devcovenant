    canonical_versions_required:
    - 'False'
    changelog_file: CHANGELOG.md
    changelog_header_prefix:
    - '## Version'
    enforce_bumping:
    - 'True'
    pep440_allow_dev_releases:
    - 'True'
    pep440_allow_post_releases:
    - 'True'
    pep440_allow_prereleases:
    - 'True'
    scheme:
    - semver
    semver_scope_tags_required:
    - 'True'
    version_file: devcovenant/VERSION
  version-sync:
    changelog_file: CHANGELOG.md
    changelog_header_prefix:
    - '## Version'
    role_extractors:
    - docs=>project_version_line
    - changelog=>changelog_header_version
    - package_manifest=>manifest_project_version
    role_legality_schemes:
    - package_manifest=>pep440
    target_role_dirs:
    - docs=>devcovenant/docs
    target_role_files:
    - docs=>README.md
    - docs=>AGENTS.md
    - docs=>CONTRIBUTING.md
    - docs=>SPEC.md
    - docs=>PLAN.md
    - changelog=>CHANGELOG.md
    - docs=>CHANGELOG.md
    - docs=>PROFILE_MAP.md
    - docs=>POLICY_MAP.md
    - docs=>devcovenant/README.md
    - docs=>devcovenant/core/README.md
    - docs=>devcovenant/custom/README.md
    - docs=>devcovenant/registry/README.md
    - docs=>devcovenant/builtin/policies/README.md
    - docs=>devcovenant/builtin/profiles/README.md
    - docs=>devcovenant/custom/policies/README.md
    - docs=>devcovenant/custom/profiles/README.md
    - package_manifest=>pyproject.toml
    target_role_globs:
    - docs=>devcovenant/docs/**/*.md
    target_roles:
    - docs
    - changelog
    - package_manifest
    version_file: devcovenant/VERSION

# User-owned overlays applied after autogen overlays.

# Merge semantics: list append + dedupe, scalar replace.

user_metadata_overlays:
  project-governance:
    stage: stable
    development_stance: active-development
    versioning_mode: versioned
    unversioned_label: Unversioned
    unreleased_heading: '## Unreleased'
  line-length-limit:
    exclude_globs:
    - devcovenant/builtin/profiles/global/assets/*.yaml
    - devcovenant/registry/**

# Auto-generated metadata overrides written by refresh.

# Override semantics: full key replacement.

# Do not hand-edit unless you intentionally own this layer.

autogen_metadata_overrides: {}

# User-owned overrides applied last (highest precedence).

# Override semantics: full key replacement.

# Shape: {policy-id: {metadata_key: value-or-list}}

user_metadata_overrides:
  modules-need-tests:
    exclude_globs:
    - devcovenant/builtin/profiles/**/assets/**
    mirror_roots:
    - devcovenant=>tests/devcovenant
  tests-coverage:
    severity: warning
