id: last-updated
text: |
  Docs must include a `Last Updated` header in the generated header zone so
  readers can trust recency. The auto-fix updates UTC dates for touched
  allowlisted docs while respecting allowlist selectors.
metadata:
  id: last-updated
  severity: error
  auto_fix: 'true'
  enforcement: active
  include_suffixes: []
  allowed_globs: []
  allowed_files: []
  allowed_suffixes: []
  required_files: []
  required_globs: []
  selector_roles:
    - include
    - allowed
    - required
  include_globs: []
  include_files: []
  include_dirs: []
  allowed_dirs: []
  required_dirs: []
