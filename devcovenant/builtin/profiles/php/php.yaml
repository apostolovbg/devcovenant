version: 1
profile: php
category: language
suffixes:
  - .php
ignore_dirs:
  - vendor
clean_overlays:
  cache_dirs:
    - .phpunit.cache
assets:
  - path: composer.json
    template: composer.json
  - path: composer.lock
    template: composer.lock
  - path: phpunit.xml
    template: phpunit.xml
translators:
  - id: php
    extensions:
      - .php
    can_handle:
      strategy: module_function
      entrypoint: php_translator.py:can_handle
    translate:
      strategy: module_function
      entrypoint: php_translator.py:translate
policy_overlays:
  dependency-license-sync:
    dependency_role_files:
      - intent=>composer.json
      - resolved=>composer.lock
  devflow-run-gates:
    required_commands:
      - phpunit
  documentation-growth-tracking:
    user_facing_suffixes:
      - .php
    user_facing_keywords:
      - controller
      - controllers
      - service
      - services
      - route
      - routes
      - endpoint
      - endpoints
  line-length-limit:
    include_suffixes:
      - .php
