version: 1
profile: ruby
category: language
suffixes:
  - .rb
  - .rake
ignore_dirs:
  - .bundle
  - vendor/bundle
clean_overlays:
  cache_dirs:
    - .bundle
assets:
  - path: Gemfile
    template: Gemfile
  - path: Gemfile.lock
    template: Gemfile.lock
translators:
  - id: ruby
    extensions:
      - .rb
      - .rake
    can_handle:
      strategy: module_function
      entrypoint: ruby_translator.py:can_handle
    translate:
      strategy: module_function
      entrypoint: ruby_translator.py:translate
policy_overlays:
  dependency-management:
    dependency_role_files:
      - intent=>Gemfile
      - resolved=>Gemfile.lock
  documentation-growth-tracking:
    user_facing_suffixes:
      - .rb
      - .rake
    user_facing_keywords:
      - controller
      - controllers
      - service
      - services
      - route
      - routes
      - endpoint
      - endpoints
  line-length-limit:
    include_suffixes:
      - .rb
      - .rake
core_invariant_overlays:
  devflow-run-gates:
    required_commands:
      - bundle exec rake test
