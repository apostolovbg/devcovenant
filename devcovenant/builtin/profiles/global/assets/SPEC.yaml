  - [non-goal 3]

  This section prevents scope drift by stating what the project is
  intentionally not trying to do.

  ## Users and Actors
  - Primary user or actor: [who interacts with the system most directly]

  - Secondary user or actor: [who else matters]

  - Operational actor: [admin, operator, automation, or integration]

  For each actor, describe what they need from the system.

  ## Core Workflows
