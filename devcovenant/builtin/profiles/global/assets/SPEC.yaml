  ## Functional Requirements
  - [requirement 1]

  - [requirement 2]

  - [requirement 3]

  Write these as durable behavioral statements.
  Prefer requirements that can later be tested or demonstrated.

  ## Non-Functional Requirements
  - Performance: [latency, throughput, scale, or responsiveness expectations]

  - Reliability: [availability, recovery, or failure-handling expectations]

  - Security: [authentication, authorization, audit, or data-protection needs]

  - Maintainability: [clarity, modularity, testability, or operational needs]

  - Usability: [user-facing clarity and workflow expectations]

  ## Data and State
  - Important entities: [core records, objects, or documents]

  - Important state transitions: [how those entities change over time]

  - Persistence rules: [what must be stored, derived, or ephemeral]

  - Audit or history needs: [what must be traceable later]

  ## Interfaces and Dependencies
  - External interfaces: [API, CLI, UI, file formats, queues, webhooks]

  - Internal interfaces: [major module or service boundaries]

  - Dependencies: [systems, libraries, or services the project relies on]

  - Compatibility expectations: [versions, protocols, or platform constraints]

  ## Constraints and Assumptions
  - Constraint: [technical, legal, operational, or organizational limit]

  - Assumption: [what the project currently assumes to be true]

  - Explicit tradeoff: [what is being optimized and what is being accepted]

  ## Acceptance Criteria
  - [criterion 1 that would prove the spec is satisfied]

  - [criterion 2 that would prove the spec is satisfied]

  - [criterion 3 that would prove the spec is satisfied]

  This section should let someone decide whether the project meets the spec
  without having to guess what success means.

  ## Open Questions
  - [question 1]

