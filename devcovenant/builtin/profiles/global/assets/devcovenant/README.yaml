body: |-
  DevCovenant helps repositories keep policy prose and enforcement logic
  aligned.

  ## Table of Contents
  1. [Overview](#overview)
  2. [Project Governance](#project-governance)
  3. [Workflow](#workflow)
  4. [Quick Start](#quick-start)
  5. [Commands](#commands)
  6. [License](#license)

  ## Overview
  Use this README for DevCovenant runtime context in this repository.
  Keep policy source text in `AGENTS.md`, requirements in `SPEC.md`, and
  active execution tasks in `PLAN.md`.

  ## Project Governance
  Project-governance is the lifecycle-metadata service that feeds managed
  doc headers, the AGENTS governance section, and tracked registry output.
  Configure it directly in `devcovenant/config.yaml` and use
  `devcovenant/docs/project_governance.md` for the detailed contract.

  ## Workflow
  Run the gate sequence for edits:
  1. `python3 -m devcovenant gate --start`
  2. Pre-test loop: `python3 -m devcovenant gate --mid`
  3. `python3 -m devcovenant test`
  4. `python3 -m devcovenant gate --end`
  In `engine.tests_output_mode: normal`, test progress stays concise while
  full child output remains available in run logs.
  On Windows, `py -m devcovenant ...` is a common equivalent launcher form.
  For source-checkout launches, DevCovenant keeps the repo clean by
  suppressing later Python cache-file writes and removing the package-import
  cache Python may emit before
  CLI (command-line interface) startup, so `python3 -m devcovenant ...`
  does not leave repo-local `__pycache__/` drift behind.

  ## Quick Start
  Install DevCovenant, review `devcovenant/config.yaml`, and deploy once
  config is ready. Use `devcovenant check` for read-only policy audits and
  gate commands for refresh/autofix workflow orchestration.
  If managed-environment is enabled and a resolved interpreter path is not
  executable, DevCovenant emits an explicit error and stops so the
  environment contract can be fixed directly.

  ## Commands
  ```bash
  devcovenant check
  devcovenant gate --start
  devcovenant gate --mid
  devcovenant test
  devcovenant gate --end
  devcovenant refresh
  ```

