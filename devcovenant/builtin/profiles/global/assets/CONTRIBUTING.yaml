body: "This file is intentionally brief. Use it as the entry point, then follow the\n\
  full guidance in `devcovenant/README.md` and the policy definitions in\n`AGENTS.md`.\n\
  \n## Table of Contents\n1. [Overview](#overview)\n2. [Workflow](#workflow)\n\n##\
  \ Overview\n- Read `AGENTS.md` for policy definitions and required workflow.\n-\
  \ Read `devcovenant/README.md` for architecture, schema, and lifecycle\n  rules.\n\
  - Check `PLAN.md` for current priorities.\nThis guide stays short by design. It\
  \ exists to point you to the canonical\nrules and to remind you that DevCovenant\
  \ enforcement applies to every\nchange, including documentation-only updates.\n\n\
  ## Workflow\nFollow the canonical gate sequence (details in `devcovenant/README.md`):\n\
  ```bash\npython3 -m devcovenant gate --start\n# pre-test mutating preflight (may rerun)\npython3 -m devcovenant gate --mid\npython3 -m devcovenant test\npython3\
  \ -m devcovenant gate --end\n```\nIf the console script is not on your PATH, use\
  \ `python3 -m devcovenant`\ninstead of `devcovenant` for CLI commands.\nIf the gate\
  \ sequence fails, fix the violations and rerun the full sequence\nbefore submitting\
  \ changes.\nIf managed-environment is enabled and a resolved interpreter path is\
  \ not executable, DevCovenant emits an explicit error and falls back to\n`managed_rerun_commands`\
  \ when configured."
