name: CI

on:
  push:
  pull_request:

jobs:
  ci-and-test:
    name: DevCovenant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: .gha-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run DevCovenant start gate
        run: python -m devcovenant gate --start

      - name: Run DevCovenant mid gate
        run: python -m devcovenant gate --mid

      - name: Run DevCovenant workflow phases
        run: python -m devcovenant run

      - name: Run DevCovenant end gate
        run: python -m devcovenant gate --end
