header_lines:
  - '# Auth Contract'
body: |-
  ## Overview
  Describe how API consumers authenticate and what authorization rules they
  must satisfy.
  Keep this document explicit enough that a client implementer does not need to
  infer security behavior from endpoint examples alone.

  ## Authentication Model
  Explain:

  - accepted authentication schemes

  - token or credential lifecycle

  - required headers or parameters

  - refresh and revocation rules

  - what happens when credentials are missing, expired, or malformed

  ## Authorization Model
  Explain:

  - roles, scopes, or capability checks

  - which endpoint groups require which permissions

  - the difference between unauthenticated and unauthorized failures

  ## Operational Notes
  Document any security-relevant client expectations such as session expiry,
  clock skew tolerance, multi-factor steps, or audit-visible identifiers.
