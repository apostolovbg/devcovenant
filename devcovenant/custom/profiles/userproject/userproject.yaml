version: 1
profile: userproject
category: repo
suffixes: []
ignore_dirs:
  - artifacts
  - .proof-wheel
  - .proof-sdist
assets:
  - path: devcovenant/docs/installation.md
    template: docs/installation.md
  - path: devcovenant/docs/config.md
    template: docs/config.md
  - path: devcovenant/docs/profiles.md
    template: docs/profiles.md
  - path: devcovenant/docs/policies.md
    template: docs/policies.md
  - path: devcovenant/docs/registry.md
    template: docs/registry.md
  - path: devcovenant/docs/refresh.md
    template: docs/refresh.md
  - path: devcovenant/docs/workflow.md
    template: docs/workflow.md
  - path: devcovenant/docs/troubleshooting.md
    template: docs/troubleshooting.md
ci_and_test:
  jobs:
    governance:
      steps: []
    build:
      name: Build
      needs: governance
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - name: Checkout
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          # v6
        - name: Set up Python
          uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
          # v6
          with:
            python-version: '3.11'
        - name: Configure Python cache root
          run: |
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/devcovenant-pycache" \
              >> "$GITHUB_ENV"
        - name: Clean local build artifacts
          run: |
            rm -rf build dist ./*.egg-info .pytest_cache .ruff_cache
        - name: Install build tooling
          run: |
            python -m pip install -r requirements.lock
        - name: Build distributions
          run: python -m build
        - name: Validate distributions
          run: twine check dist/*
        - name: Generate CycloneDX SBOM
          run: |
            mkdir -p artifacts/sbom
            cyclonedx-py requirements requirements.lock \
              --pyproject pyproject.toml \
              --mc-type application \
              --output-reproducible \
              --output-file artifacts/sbom/devcovenant-sbom.json
        - name: Generate build provenance
          env:
            CI_RUN_ID: ${{ github.run_id }}
            CI_RUN_ATTEMPT: ${{ github.run_attempt }}
            CI_HEAD_SHA: ${{ github.sha }}
          run: |
            mkdir -p artifacts/provenance
            python - <<'PY'
            import hashlib
            import json
            import os
            from pathlib import Path

            def sha256_for(path: Path) -> str:
                digest = hashlib.sha256()
                digest.update(path.read_bytes())
                return digest.hexdigest()

            dist_files = sorted(Path("dist").glob("*"))
            payload = {
                "workflow": "CI",
                "job": "Build",
                "ci_run_id": os.environ["CI_RUN_ID"],
                "ci_run_attempt": os.environ["CI_RUN_ATTEMPT"],
                "head_sha": os.environ["CI_HEAD_SHA"],
                "distributions": [
                    {
                        "name": path.name,
                        "sha256": sha256_for(path),
                    }
                    for path in dist_files
                ],
            }
            Path("artifacts/provenance/build-provenance.json").write_text(
                json.dumps(payload, indent=2) + "\n",
                encoding="utf-8",
            )
            PY
        - name: Prove wheel artifact lifecycle
          run: |
            set -euo pipefail
            WHEEL_PATH="$(python - <<'PY'
            from pathlib import Path

            matches = sorted(Path("dist").glob("*.whl"))
            if not matches:
                raise SystemExit(1)
            print(matches[0].resolve())
            PY
            )"
            test -n "$WHEEL_PATH"
            python -m venv .proof-wheel
            . .proof-wheel/bin/activate
            python -m pip install -r requirements.lock
            python -m pip install --no-deps "$WHEEL_PATH"
            git init -q artifacts/wheel-proof
            pushd artifacts/wheel-proof >/dev/null
            git config user.name ci
            git config user.email ci@example.invalid
            python -m devcovenant install
            python - <<'PY'
            from pathlib import Path

            path = Path("devcovenant/config.yaml")
            lines = path.read_text(encoding="utf-8").splitlines()
            for index, line in enumerate(lines):
                if line.strip() == "config_reviewed: false":
                    indent = line[: len(line) - len(line.lstrip())]
                    lines[index] = f"{indent}config_reviewed: true"
                    path.write_text(
                        "\n".join(lines) + "\n",
                        encoding="utf-8",
                    )
                    break
            else:
                raise SystemExit(
                    "config_reviewed field line not found in config.yaml"
                )
            PY
            python -m devcovenant deploy
            mkdir -p tests
            cat > tests/__init__.py <<'PY'
            """Proof-test package for artifact workflow validation."""
            PY
            cat > tests/test_smoke.py <<'PY'
            """Installed artifact smoke tests for lifecycle proof."""

            import unittest


            class SmokeTest(unittest.TestCase):
                """Prove the packaged workflow can run a minimal test suite."""

                def test_truth(self) -> None:
                    """Keep the installed-artifact proof suite non-empty."""
                    self.assertTrue(True)


            if __name__ == "__main__":
                unittest.main()
            PY
            python -m devcovenant refresh
            git add .
            git commit -m "bootstrap installed repo"
            python3 -m venv .venv
            .venv/bin/python -m pip install -r requirements.lock
            .venv/bin/python -m pip install --no-deps "$WHEEL_PATH"
            .venv/bin/python -m devcovenant --version
            .venv/bin/python -m devcovenant gate --start
            .venv/bin/python -m devcovenant gate --mid
            .venv/bin/python -m devcovenant run
            .venv/bin/python -m devcovenant gate --end
            .venv/bin/python -m devcovenant check
            popd >/dev/null
        - name: Prove sdist artifact lifecycle
          run: |
            set -euo pipefail
            SDIST_PATH="$(python - <<'PY'
            from pathlib import Path

            matches = sorted(Path("dist").glob("*.tar.gz"))
            if not matches:
                raise SystemExit(1)
            print(matches[0].resolve())
            PY
            )"
            test -n "$SDIST_PATH"
            python -m venv .proof-sdist
            . .proof-sdist/bin/activate
            python -m pip install -r requirements.lock
            python -m pip install --no-deps "$SDIST_PATH"
            git init -q artifacts/sdist-proof
            pushd artifacts/sdist-proof >/dev/null
            git config user.name ci
            git config user.email ci@example.invalid
            python -m devcovenant install
            python - <<'PY'
            from pathlib import Path

            path = Path("devcovenant/config.yaml")
            lines = path.read_text(encoding="utf-8").splitlines()
            for index, line in enumerate(lines):
                if line.strip() == "config_reviewed: false":
                    indent = line[: len(line) - len(line.lstrip())]
                    lines[index] = f"{indent}config_reviewed: true"
                    path.write_text(
                        "\n".join(lines) + "\n",
                        encoding="utf-8",
                    )
                    break
            else:
                raise SystemExit(
                    "config_reviewed field line not found in config.yaml"
                )
            PY
            python -m devcovenant deploy
            mkdir -p tests
            cat > tests/__init__.py <<'PY'
            """Proof-test package for artifact workflow validation."""
            PY
            cat > tests/test_smoke.py <<'PY'
            """Installed artifact smoke tests for lifecycle proof."""

            import unittest


            class SmokeTest(unittest.TestCase):
                """Prove the packaged workflow can run a minimal test suite."""

                def test_truth(self) -> None:
                    """Keep the installed-artifact proof suite non-empty."""
                    self.assertTrue(True)


            if __name__ == "__main__":
                unittest.main()
            PY
            python -m devcovenant refresh
            git add .
            git commit -m "bootstrap installed repo"
            python3 -m venv .venv
            .venv/bin/python -m pip install -r requirements.lock
            .venv/bin/python -m pip install --no-deps "$SDIST_PATH"
            .venv/bin/python -m devcovenant --version
            .venv/bin/python -m devcovenant gate --start
            .venv/bin/python -m devcovenant gate --mid
            .venv/bin/python -m devcovenant run
            .venv/bin/python -m devcovenant gate --end
            .venv/bin/python -m devcovenant check
            popd >/dev/null
        - name: Install DevCovenant with pipx
          run: python -m pipx install --force dist/*.whl
        - name: Resolve pipx bin directory
          run: |
            PIPX_BIN_DIR="$(python -m pipx environment --value PIPX_BIN_DIR)"
            echo "PIPX_BIN_DIR=$PIPX_BIN_DIR" >> "$GITHUB_ENV"
        - name: Prove pipx operator lifecycle
          run: |
            set -euo pipefail
            WHEEL_PATH="$(python - <<'PY'
            from pathlib import Path

            matches = sorted(Path("dist").glob("*.whl"))
            if not matches:
                raise SystemExit(1)
            print(matches[0].resolve())
            PY
            )"
            test -n "$WHEEL_PATH"
            TMPDIR="$(mktemp -d)"
            trap 'rm -rf "$TMPDIR"' EXIT
            git init -q artifacts/pipx-proof
            pushd artifacts/pipx-proof >/dev/null
            git config user.name ci
            git config user.email ci@example.invalid
            "$PIPX_BIN_DIR/devcovenant" --version
            "$PIPX_BIN_DIR/devcovenant" install
            python - <<'PY'
            from pathlib import Path

            path = Path("devcovenant/config.yaml")
            lines = path.read_text(encoding="utf-8").splitlines()
            reviewed = False
            managed = False
            inserted_profile = False
            for index, line in enumerate(lines):
                stripped = line.strip()
                if stripped == "config_reviewed: false":
                    indent = line[: len(line) - len(line.lstrip())]
                    lines[index] = f"{indent}config_reviewed: true"
                    reviewed = True
                    continue
                if stripped == "managed-environment: false":
                    indent = line[: len(line) - len(line.lstrip())]
                    lines[index] = f"{indent}managed-environment: true"
                    managed = True
            for index, line in enumerate(lines):
                if line.strip() != "active:":
                    continue
                insert_at = index + 1
                existing_item_indent = None
                while (
                    insert_at < len(lines)
                ):
                    candidate = lines[insert_at]
                    candidate_stripped = candidate.strip()
                    if not candidate_stripped.startswith("- "):
                        break
                    candidate_indent = (
                        candidate[: len(candidate) - len(candidate.lstrip())]
                    )
                    if existing_item_indent is None:
                        existing_item_indent = candidate_indent
                    if candidate_indent != existing_item_indent:
                        break
                    if candidate_stripped == "- python_venv":
                        inserted_profile = True
                        break
                    insert_at += 1
                if existing_item_indent is None:
                    raise SystemExit(
                        "profiles.active items not found in config.yaml"
                    )
                if not inserted_profile:
                    lines.insert(
                        insert_at,
                        f"{existing_item_indent}- python_venv",
                    )
                    inserted_profile = True
                break
            if not reviewed:
                raise SystemExit(
                    "config_reviewed field line not found in config.yaml"
                )
            if not managed:
                raise SystemExit(
                    "managed-environment field line not found in config.yaml"
                )
            if not inserted_profile:
                raise SystemExit(
                    "profiles.active block not found in config.yaml"
                )
            path.write_text(
                "\n".join(lines) + "\n",
                encoding="utf-8",
            )
            PY
            "$PIPX_BIN_DIR/devcovenant" deploy
            mkdir -p tests
            cat > tests/__init__.py <<'PY'
            """Proof-test package for artifact workflow validation."""
            PY
            cat > tests/test_smoke.py <<'PY'
            """Installed artifact smoke tests for lifecycle proof."""

            import unittest


            class SmokeTest(unittest.TestCase):
                """Prove the packaged workflow can run a minimal test suite."""

                def test_truth(self) -> None:
                    """Keep the installed-artifact proof suite non-empty."""
                    self.assertTrue(True)


            if __name__ == "__main__":
                unittest.main()
            PY
            "$PIPX_BIN_DIR/devcovenant" refresh
            git add .
            git commit -m "bootstrap pipx repo"
            python3 -m venv .venv
            .venv/bin/python -m pip install -r requirements.lock
            .venv/bin/python -m pip install --no-deps "$WHEEL_PATH"
            "$PIPX_BIN_DIR/devcovenant" gate --start
            "$PIPX_BIN_DIR/devcovenant" gate --mid
            "$PIPX_BIN_DIR/devcovenant" run
            "$PIPX_BIN_DIR/devcovenant" gate --end
            "$PIPX_BIN_DIR/devcovenant" check
            popd >/dev/null
        - name: Upload distributions
          uses: "actions/upload-artifact@\
            bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
          # v7
          with:
            name: devcovenant-dist
            path: dist/*
        - name: Upload SBOM
          uses: "actions/upload-artifact@\
            bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
          # v7
          with:
            name: devcovenant-sbom
            path: artifacts/sbom/*.json
        - name: Upload build provenance
          uses: "actions/upload-artifact@\
            bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
          # v7
          with:
            name: devcovenant-provenance
            path: artifacts/provenance/*.json
policy_overlays:
  dependency-management:
    surfaces:
      - id: root_workspace
        generate_hashes: true
      - id: package_runtime
        enabled: false
      - id: devcovenant_runtime
        direct_dependency_files:
          - pyproject.toml
        dependency_files:
          - pyproject.toml
        generate_hashes: true
  documentation-growth-tracking:
    user_facing_files:
      - devcovenant/cli.py
      - devcovenant/__main__.py
    user_facing_exclude_globs:
      - devcovenant/core/*.py
      - devcovenant/custom/policies/**/fixers/**
    doc_routes:
      - "devcovenant/builtin/policies/ => devcovenant/docs/policies.md"
      - >-
        devcovenant/builtin/profiles/*/*.yaml =>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/*/profiles/*/*translator.py=>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/builtin/profiles/**/config.yaml =>
        devcovenant/docs/config.md
      - >-
        devcovenant/*/profiles/**/assets/** =>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/*/profiles/*/assets/*.yaml=>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/*/profiles/*/assets/*.yml=>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/*/profiles/**/assets/**/*.yaml=>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/*/profiles/**/assets/**/*.yml=>
        devcovenant/docs/profiles.md
      - >-
        devcovenant/custom/profiles/__init__.py =>
        devcovenant/docs/profiles.md
      - "devcovenant/custom/profiles/*.py => devcovenant/docs/profiles.md"
      - "devcovenant/custom/profiles/**/*.py => devcovenant/docs/profiles.md"
      - "devcovenant/custom/profiles/**/*.yaml => devcovenant/docs/profiles.md"
      - "bandit.yaml => SECURITY.md"
      - "devcovenant/custom/policies/**/*.yaml => devcovenant/docs/policies.md"
      - "devcovenant/custom/policies/**/*.py => devcovenant/docs/policies.md"
      - >-
        devcovenant/custom/policies/**/autofix/**=>
        devcovenant/docs/policies.md
      - "devcovenant/core/*.py => devcovenant/docs/architecture.md"
      - "devcovenant/core/cli_support.py => devcovenant/docs/workflow.md"
      - "devcovenant/core/execution.py => devcovenant/docs/workflow.md"
      - "devcovenant/core/gate_runtime.py => devcovenant/docs/workflow.md"
      - "devcovenant/core/refresh_runtime.py => devcovenant/docs/workflow.md"
      - "devcovenant/core/run_*.py => devcovenant/docs/workflow.md"
      - "devcovenant/core/workflow_support.py => devcovenant/docs/workflow.md"
      - "devcovenant/*.py => devcovenant/docs/installation.md"
      - "pyproject.toml => devcovenant/docs/installation.md"
      - "MANIFEST.in => devcovenant/docs/installation.md"
      - "devcovenant/config.yaml => devcovenant/docs/config.md"
      - "devcovenant/registry/registry.yaml => devcovenant/docs/registry.md"
      - ".pre-commit-config.yaml => devcovenant/docs/workflow.md"
      - ".github/workflows/*.yml => devcovenant/docs/workflow.md"
    user_visible_files:
      - SECURITY.md
      - PRIVACY.md
      - SUPPORT.md
      - devcovenant/README.md
      - devcovenant/docs/architecture.md
      - devcovenant/docs/installation.md
      - devcovenant/docs/config.md
      - devcovenant/docs/profiles.md
      - devcovenant/docs/policies.md
      - devcovenant/docs/registry.md
      - devcovenant/docs/refresh.md
      - devcovenant/docs/workflow.md
      - devcovenant/docs/troubleshooting.md
    doc_quality_files:
      - SECURITY.md
      - PRIVACY.md
      - SUPPORT.md
      - devcovenant/README.md
      - devcovenant/docs/architecture.md
      - devcovenant/docs/installation.md
      - devcovenant/docs/config.md
      - devcovenant/docs/profiles.md
      - devcovenant/docs/policies.md
      - devcovenant/docs/registry.md
      - devcovenant/docs/refresh.md
      - devcovenant/docs/workflow.md
      - devcovenant/docs/troubleshooting.md
    user_visible_dirs:
      - devcovenant/docs
    doc_quality_dirs:
      - devcovenant/docs
  line-length-limit:
    exclude_globs:
      - devcovenant/builtin/profiles/global/assets/*.yaml
      - devcovenant/builtin/profiles/global/assets/**/*.yaml
      - devcovenant/licenses/**
      - devcovenant/registry/**
      - tests/devcovenant/builtin/**
    include_globs:
      - devcovenant/**
      - tests/**
    long_lines_between:
      - devcovenant/builtin/policies/=>.yaml
      - devcovenant/custom/policies/=>.yaml
  name-clarity:
    exclude_globs:
      - tests/devcovenant/builtin/**
    include_globs:
      - devcovenant/**/*.py
      - tests/**/*.py
  docstring-and-comment-coverage:
    exclude_globs:
      - tests/devcovenant/builtin/**
    include_globs:
      - devcovenant/**/*.py
      - tests/**/*.py
  security-scanner:
    exclude_globs:
      - tests/devcovenant/builtin/**
    include_globs:
      - devcovenant/**/*.py
      - tests/**/*.py
  no-raw-errors:
    exclude_globs:
      - tests/devcovenant/builtin/**
    include_globs:
      - devcovenant/**/*.py
      - tests/**/*.py
  no-print-outside-output-runtime:
    include_suffixes:
      - .py
    include_globs:
      - devcovenant/**/*.py
    exclude_globs:
      - devcovenant/builtin/profiles/**/assets/**
      - tests/**
    allowed_file_globs:
      - devcovenant/core/execution.py
    allow_waiver_comment: 'DEVCOV_ALLOW_OUTPUT:'
  last-updated:
    allowed_globs:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - PLAN.md
      - SPEC.md
      - CHANGELOG.md
      - PROFILE_MAP.md
      - POLICY_MAP.md
      - SECURITY.md
      - PRIVACY.md
      - SUPPORT.md
      - devcovenant/README.md
      - devcovenant/core/README.md
      - devcovenant/custom/README.md
      - devcovenant/registry/README.md
      - devcovenant/builtin/policies/README.md
      - devcovenant/builtin/profiles/README.md
      - devcovenant/custom/policies/README.md
      - devcovenant/custom/profiles/README.md
      - devcovenant/docs/*.md
      - devcovenant/docs/**/*.md
    required_globs:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - PLAN.md
      - SPEC.md
      - CHANGELOG.md
      - PROFILE_MAP.md
      - POLICY_MAP.md
      - SECURITY.md
      - PRIVACY.md
      - SUPPORT.md
      - devcovenant/README.md
      - devcovenant/core/README.md
      - devcovenant/custom/README.md
      - devcovenant/registry/README.md
      - devcovenant/builtin/policies/README.md
      - devcovenant/builtin/profiles/README.md
      - devcovenant/custom/policies/README.md
      - devcovenant/custom/profiles/README.md
      - devcovenant/docs/*.md
      - devcovenant/docs/**/*.md
  modules-need-tests:
    exclude_prefixes:
      - build
      - dist
      - node_modules
      - tests
    watch_dirs:
      - tests
    tests_watch_dirs:
      - tests
    mirror_roots:
      - devcovenant=>tests/devcovenant
  tests-coverage:
    exclude_globs:
      - devcovenant/core/*.py
      - devcovenant/custom/policies/**/fixers/**
  version-sync:
    version_file: devcovenant/VERSION
    target_role_files:
      - docs=>README.md
      - docs=>AGENTS.md
      - docs=>CONTRIBUTING.md
      - docs=>PLAN.md
      - docs=>SPEC.md
      - docs=>CHANGELOG.md
      - docs=>PROFILE_MAP.md
      - docs=>POLICY_MAP.md
      - docs=>SECURITY.md
      - docs=>PRIVACY.md
      - docs=>SUPPORT.md
      - docs=>devcovenant/README.md
      - docs=>devcovenant/core/README.md
      - docs=>devcovenant/custom/README.md
      - docs=>devcovenant/registry/README.md
      - docs=>devcovenant/builtin/policies/README.md
      - docs=>devcovenant/builtin/profiles/README.md
      - docs=>devcovenant/custom/policies/README.md
      - docs=>devcovenant/custom/profiles/README.md
    target_role_globs:
      - docs=>devcovenant/docs/**/*.md
    target_role_dirs:
      - docs=>devcovenant/docs
  version-governance:
    canonical_versions_required: true
    scheme: pep440
    version_file: devcovenant/VERSION
  package-artifact-mirror:
    file_mirrors:
      - LICENSE=>devcovenant/licenses/LICENSE
    dir_mirrors: []
    dir_skip_paths: []
  package-doc-sync:
    sync_pairs:
      - README.md=>devcovenant/README.md
    omit_block_pairs:
      - "<!-- REPO-ONLY:BEGIN -->=><!-- REPO-ONLY:END -->"
    rewrite_repo_relative_links: true
project-governance:
  project_name: devcovenant
  project_description: devcovenant is a repository governance framework.
  stage: stable
  maintenance_stance: active
  compatibility_policy: forward-only
  versioning_mode: versioned
