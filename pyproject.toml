[build-system]
requires = [
  "setuptools>=77",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "DevCovenant"
version = "1.0.0"
description = "DevCovenant is a Repository Governance Framework."
readme = {file = "devcovenant/README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "licenses/THIRD_PARTY_LICENSES.md",
  "licenses/*.txt",
]
keywords = [
  "governance",
  "policy",
  "workflow",
  "compliance",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "packaging>=26.0",
  "pre-commit>=4.5.1",
  "pip-tools>=7.5.3",
  "PyYAML>=6.0.2",
  "pytest>=9.0.2",
  "semver>=3.0.2",
]
[project.urls]
Homepage = "https://github.com/apostolovbg/devcovenant"
Repository = "https://github.com/apostolovbg/devcovenant"
Issues = "https://github.com/apostolovbg/devcovenant/issues"

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
include = [
  "devcovenant",
  "devcovenant.*",
]
exclude = [
  "devcovenant.core.policies",
  "devcovenant.core.policies.*",
  "devcovenant.core.profiles",
  "devcovenant.core.profiles.*",
  "devcovenant.custom.policies.*",
  "devcovenant.custom.profiles.*",
]
namespaces = false
[tool.setuptools.exclude-package-data]
"*" = [
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
"devcovenant" = [
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
"devcovenant.core" = [
  "policies/*",
  "policies/**",
  "profiles/*",
  "profiles/**",
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
[project.scripts]
devcovenant = "devcovenant.cli:main"
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff]
line-length = 79

[tool.ruff.format]
