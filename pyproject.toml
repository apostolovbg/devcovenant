[build-system]
requires = [
  "setuptools>=77",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "devcovenant"
version = "1.0.1"
description = "devcovenant is a repository governance framework."
readme = {file = "devcovenant/README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "licenses/THIRD_PARTY_LICENSES.md",
  "licenses/*.txt",
]
maintainers = [
  {name = "DevCovenant Maintainers"},
]
keywords = [
  "governance",
  "policy",
  "workflow",
  "compliance",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "packaging>=26.0",
  "pre-commit>=4.5.1",
  "pip-tools>=7.5.3",
  "PyYAML>=6.0.2",
  "pytest>=9.0.2",
  "semver>=3.0.2",
  "tomli>=2.3.0; python_version < '3.11'",
]
[project.urls]
Homepage = "https://github.com/apostolovbg/devcovenant"
Documentation = "https://github.com/apostolovbg/devcovenant/tree/v1.0.1/devcovenant/docs"
Repository = "https://github.com/apostolovbg/devcovenant"
Issues = "https://github.com/apostolovbg/devcovenant/issues"
Changelog = "https://github.com/apostolovbg/devcovenant/blob/v1.0.1/CHANGELOG.md"

[tool.setuptools]
include-package-data = false
[tool.setuptools.packages.find]
include = [
  "devcovenant",
  "devcovenant.*",
]
exclude = [
  "devcovenant.core.policies",
  "devcovenant.core.policies.*",
  "devcovenant.core.profiles",
  "devcovenant.core.profiles.*",
  "devcovenant.custom.policies.*",
  "devcovenant.custom.profiles.*",
]
namespaces = false
[tool.setuptools.package-data]
"devcovenant" = [
  "README.md",
  "VERSION",
  "runtime-requirements.lock",
  "docs/*.md",
  "docs/*.png",
  "logs/README.md",
  "registry/README.md",
]
"devcovenant.builtin.policies" = [
  "README.md",
  "*/*.yaml",
]
"devcovenant.builtin.profiles" = [
  "README.md",
  "*/*.py",
  "*/*.yaml",
  "*/assets/*",
  "*/assets/**/*",
  "*/assets/.*",
  "*/assets/**/.*",
  "global/assets/.github/workflows/*.yml",
  "global/assets/.github/workflows/*.yaml",
]
"devcovenant.custom" = [
  "README.md",
]
"devcovenant.custom.policies" = [
  "README.md",
]
"devcovenant.custom.profiles" = [
  "README.md",
]
[tool.setuptools.exclude-package-data]
"*" = [
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
"devcovenant" = [
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
"devcovenant.core" = [
  "policies/*",
  "policies/**",
  "profiles/*",
  "profiles/**",
  "*.py[cod]",
  "**/*.py[cod]",
  "__pycache__/*",
  "**/__pycache__/*",
]
[project.scripts]
devcovenant = "devcovenant.cli:main"
[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff]
line-length = 79

[tool.ruff.format]
